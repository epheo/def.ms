name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # base image is :latest, so never reuse a cached layer for it
          pull: true
          tags: |
            quay.io/epheo/def-ms:latest
            quay.io/epheo/def-ms:main
            quay.io/epheo/def-ms:${{ github.sha }}
