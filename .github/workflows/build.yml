name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # base image is :latest, so never reuse a cached layer for it
          pull: true
          # links the package to this repository on ghcr
          labels: org.opencontainers.image.source=https://github.com/epheo/def.ms
          tags: |
            ghcr.io/epheo/def-ms:latest
            ghcr.io/epheo/def-ms:main
            ghcr.io/epheo/def-ms:${{ github.sha }}
